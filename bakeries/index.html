// ── LIVE CLOCK (Amman UTC+3) ──────────────────────────────────

function LiveClock() {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);
  const timeStr = new Intl.DateTimeFormat('en-GB',{
    timeZone:'Asia/Amman', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
  }).format(now);
  const dateStr = new Intl.DateTimeFormat('en-GB',{
    timeZone:'Asia/Amman', weekday:'short', day:'2-digit', month:'short'
  }).format(now);
  return (
    <div className="text-right hidden sm:block select-none">
      <div className="jmono text-burnt-gold text-lg font-bold tracking-widest leading-none">
        {timeStr}
      </div>
      <div className="jmono text-white/30 text-[10px] mt-0.5 tracking-wider uppercase">
        {dateStr} · Amman (UTC+3)
      </div>
    </div>
  );
}

// ── TOP SELLING ITEMS (sorted by revenue + progress bars) ─────

function TopSellingItems({sales}) {
  const top5 = useMemo(() =>
    [...sales].sort((a,b) => b.revenue - a.revenue).slice(0,5)

  const maxRev = top5[0]?.revenue || 1;

  return (
    <div className="bg-white/5 backdrop-blur-sm border border-white/10 rounded-xl p-6 h-full">
      <h3 className="text-base font-black tracking-tight mb-5 flex items-center gap-2">
        <Award size={17} className="text-burnt-gold"/>
        TOP SELLING ITEMS
        <span className="ml-auto text-[10px] jmono text-white/30 font-normal">by revenue</span>
      </h3>
      <div className="space-y-4">
        {top5.map((item, idx) => {
          const pct = (item.revenue / maxRev) * 100;
          return (
            <div key={item.id}>
              <div className="flex items-center justify-between mb-1.5 gap-2">
                <div className="flex items-center gap-2 min-w-0">
                  {idx < 3
                    ? <span className="text-base leading-none w-5 text-center flex-shrink-0">{medals[idx]}</span>
                    : <span className="text-burnt-gold jmono text-xs w-5 text-center flex-shrink-0">#{idx+1}</span>
                  }
                  <span className="font-semibold text-sm truncate">{item.itemName}</span>
                </div>
                <div className="flex items-center gap-3 flex-shrink-0 text-xs jmono">
                  <span className="text-white/40">{item.quantity} sold</span>
                  <span className="text-burnt-gold font-bold">{item.revenue.toFixed(2)} JD</span>
                </div>
              </div>
              <div className="h-1.5 bg-white/8 rounded-full overflow-hidden">
                <motion.div
                  initial={{width:0}}
                  animate={{width:`${pct}%`}}
                  transition={{duration:0.9,delay:idx*0.12,ease:[0.2,0.65,0.3,0.9]}}
                  className="h-full rounded-full"
                  style={{
                    background: idx===0
                      ? 'linear-gradient(90deg,#C5A059,#E8C36A)'
                      : idx===1
                      ? 'rgba(197,160,89,0.75)'
                      : 'rgba(197,160,89,0.42)'
                  }}
                />
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── SALES CHART ───────────────────────────────────────────────

function SalesChart({sales}) {
  const [view, setView] = useState('category');
  const catSales = useMemo(() =>
    sales.reduce((acc,s) => { acc[s.category]=(acc[s.category]||0)+s.quantity; return acc; }, {})
  , [sales]);
  const maxCat = Math.max(...Object.values(catSales), 1);

  return (
    <div className="bg-white/5 backdrop-blur-sm border border-white/10 rounded-xl p-6 h-full">
      <div className="flex justify-between items-center mb-5">
        <h3 className="text-base font-black tracking-tight">SALES ANALYSIS</h3>
        <div className="flex gap-2">
          {['category','hourly'].map(v => (
            <button key={v} onClick={()=>setView(v)}
              className={`px-3 py-1 text-xs rounded-md transition-all jmono ${
                view===v ? 'bg-burnt-gold text-black font-bold' : 'bg-white/10 text-white/50'
              }`}>
              {v==='category' ? 'Category' : 'Hourly'}
            </button>
          ))}
        </div>
      </div>
      {view==='category' ? (
        <div className="space-y-4">
          {Object.entries(catSales).map(([cat,qty]) => (
            <div key={cat} className="space-y-1.5">
              <div className="flex justify-between text-xs">
                <span className="capitalize jmono text-white/50 tracking-wider">{cat}</span>
                <span className="font-bold">{qty} units</span>
              </div>
              <div className="h-2 bg-white/10 rounded-full overflow-hidden">
                <motion.div initial={{width:0}}
                  animate={{width:`${(qty/maxCat)*100}%`}}
                  transition={{duration:0.8,ease:[0.2,0.65,0.3,0.9]}}
                  className="h-full bg-burnt-gold rounded-full"/>
              </div>
            </div>
          ))}
        </div>
      ) : (
        <div className="flex items-end justify-between h-36 gap-1.5">
          {[6,8,10,12,14,16,18,20].map(hour => {
            const hSales = sales.filter(s=>s.timestamp.getHours()===hour).reduce((sum,s)=>sum+s.quantity,0);
            const h = Math.max(4,(hSales/60)*130);
            return (
              <div key={hour} className="flex-1 flex flex-col items-center gap-1.5">
                <div className="relative w-full bg-white/10 rounded-t-sm overflow-hidden" style={{height:`${h}px`}}>
                  <motion.div initial={{height:0}} animate={{height:'100%'}}
                    transition={{duration:0.5,delay:hour*0.02}}
                    className="absolute bottom-0 w-full bg-burnt-gold"/>
                </div>
                <span className="text-[9px] text-white/30 jmono">{hour}h</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Dashboard({onClose, sales, setSales}) {
  const [toasts, setToasts] = useState([]);
  const totalRevenue = useMemo(()=>sales.reduce((s,r)=>s+r.revenue,0),[sales]);
  const totalUnits   = useMemo(()=>sales.reduce((s,r)=>s+r.quantity,0),[sales]);
  const avgOrder     = useMemo(()=>sales.length?totalRevenue/sales.length:0,[sales,totalRevenue]);

  // ── INVENTORY ALERT useEffect ──
  useEffect(() => {
    const lowItems = inventoryData.filter(i => i.currentStock <= i.reorderLevel);
    lowItems.forEach((item, idx) => {
      const id = Date.now() + idx;
      setTimeout(() => {
        setToasts(prev => [...prev, {
          id,
          message: `${item.name} is below reorder level — ${item.currentStock}${item.unit} remaining`,
          sub: `Supplier: ${item.supplier} · Reorder at ≤${item.reorderLevel}${item.unit}`
        }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 7000);
      }, idx * 950 + 700);
    });
  }, []);

  const dismissToast = useCallback(id => setToasts(prev=>prev.filter(t=>t.id!==id)), []);

  const handleExport = () => {
    const csv = ['Item,Qty,Revenue,Time',...sales.map(s=>`${s.itemName},${s.quantity},${s.revenue},${s.timestamp.toISOString()}`)].join('\n');
    const blob = new Blob([csv],{type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=`flour-lab-${new Date().toISOString().slice(0,10)}.csv`; a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="min-h-screen bg-charcoal text-paper-white">
      <ToastContainer toasts={toasts} onDismiss={dismissToast}/>

      {/* Header: LiveClock + HeadBakerAvatar */}
      <div className="sticky top-0 z-50 bg-black/96 backdrop-blur-xl border-b border-white/8">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex items-center gap-4">
          <div className="flex-1 min-w-0">
            <h1 className="text-xl font-black tracking-tighter leading-none">LAB DASHBOARD</h1>
            <p className="text-white/30 text-[9px] jmono mt-0.5 tracking-wider hidden sm:block">
              FL-AMM-001 // REAL-TIME ANALYTICS
            </p>
          </div>
          <LiveClock/>
          <div className="flex items-center gap-2 flex-shrink-0">
            <button onClick={handleExport}
              className="px-3 py-2 border border-white/15 rounded-lg text-white/55 text-xs
                         hover:bg-white/5 transition-all items-center gap-1.5 hidden sm:flex">
              <Download size={12}/> Export
            </button>
            <button onClick={()=>setSales(generateMockSales())}
              className="px-3 py-2 bg-white/8 rounded-lg text-white/55 text-xs
                         hover:bg-white/15 transition-all flex items-center gap-1.5">
              <RefreshCw size={12}/>
              <span className="hidden sm:inline">Refresh</span>
            </button>
            <HeadBakerAvatar/>
            <button onClick={onClose}
              className="px-3 py-2 bg-burnt-gold text-black rounded-lg text-xs font-bold
                         hover:bg-burnt-gold-light transition-all flex items-center gap-1.5">
              <X size={12}/>
              <span className="hidden sm:inline">Exit</span>
            </button>
          </div>
        </div>
      </div>

      <div className="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-5">

        {/* KPI Row — mobile: 1col, sm: 2col, lg: 4col */}
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <StatCard title="TOTAL REVENUE"   value={`${totalRevenue.toFixed(2)} JOD`} change={5.2}  icon={<DollarSign size={20}/>}/>
          <StatCard title="UNITS SOLD"      value={totalUnits}                        change={-2.1} icon={<ShoppingCart size={20}/>}/>
          <StatCard title="AVG ORDER VALUE" value={`${avgOrder.toFixed(2)} JOD`}     change={1.8}  icon={<TrendingUp size={20}/>}/>
          <StatCard title="ACTIVE CULTURES" value="3 Strains"                         change={0}    icon={<Activity size={20}/>}/>
        </div>

        {/* KPI Targets — 5 col on lg, stacked on mobile */}
        <KPIGrid kpis={kpis}/>

        {/* Charts + Top Items */}
        <div className="grid lg:grid-cols-2 gap-5">
          <SalesChart sales={sales}/>
          <TopSellingItems sales={sales}/>
        </div>

        {/* Inventory + Suppliers */}
        <div className="grid lg:grid-cols-3 gap-5">
          <div className="lg:col-span-2"><InventoryTable inventory={inventoryData}/></div>
          <div className="bg-white/5 backdrop-blur-sm border border-white/10 rounded-xl p-5">
            <h3 className="text-base font-black tracking-tight flex items-center gap-2 mb-4">
              <Truck size={15} className="text-burnt-gold"/> SUPPLIERS

            <div className="space-y-3">
              {suppliers.map(s => (
                <div key={s.id} className="bg-white/5 border border-white/8 rounded-xl p-4">
                  <div className="flex justify-between items-start mb-2">
                    <h4 className="font-bold text-sm">{s.name}</h4>
                    <span className="text-green-400 text-xs jmono">{s.reliability}%</span>
                  </div>

                  <div className="flex justify-between text-xs">

        {/* Employee Performance */}
        <EmployeeTable employees={employees}/>

        {/* Quick Actions */}
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
          {[

              {a.icon}
              <p className="text-sm font-bold">{a.label}</p>
              <p className="text-xs text-white/35 mt-0.5">{a.sub}</p>
            </button>
          ))}
        </div>

        <div className="text-center text-white/15 jmono text-[9px] py-4 border-t border-white/5 tracking-wider">
          FLOUR LAB — FL-AMM-001 // FERMENTATION CORE v4.2 · POWERED BY CLARIX SOLUTIONS
        </div>
      </div>
    </div>
  );
}

function MagneticButton({children, onClick, className}) {
  const ref = useRef(null);
  return (
    <button ref={ref}
      onMouseMove={e => {
        if(!ref.current) return;
        const r = ref.current.getBoundingClientRect();
        ref.current.style.transform = `translate(${(e.clientX-r.left-r.width/2)*0.14}px,${(e.clientY-r.top-r.height/2)*0.14}px)`;
      }}
      onMouseLeave={() => ref.current && (ref.current.style.transform='translate(0,0)')}
      onClick={onClick}
      className={`transition-transform duration-300 ease-out ${className}`}>
      {children}
    </button>
  );
}

function CategoryMenu({category, items, title, icon}) {

  const catItems = items.filter(i => i.category===category);

    <motion.div ref={ref}
      initial={{opacity:0,y:50}} animate={inView?{opacity:1,y:0}:{}}
      transition={{duration:0.6}} className="mb-20">
      <div className="flex items-center gap-3 mb-8 border-b border-white/10 pb-4">
        <div className="text-burnt-gold">{icon}</div>
        <h2 className="text-2xl font-black tracking-tight">{title}</h2>

      </div>
      <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-px bg-white/10">

            <p className="text-white/35 text-xs jmono leading-relaxed">{item.description}</p>
            <AnimatePresence>

                  exit={{opacity:0,height:0}} transition={{duration:0.25}}
